# The backend for sticky-assistant, in one command:
#
#   cp backend/.env.example backend/.env   # then add an AI provider's API key
#   docker compose up -d
#
# Then set the device's backend to http://<this computer's IP>:8000/converse.
# The first start downloads the speech model (about 500MB for "small").
services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: backend/.env
        required: false
    volumes:
      - sticky-assistant-data:/data

volumes:
  sticky-assistant-data:
