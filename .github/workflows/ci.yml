name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  firmware-build:
    name: Build firmware (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: "firmware"
          # The merged image is what the Playground's website form takes.
          command: idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o merged.bin @flash_args
      - name: Package as a release would
        run: python3 scripts/package_release.py 0.0.0-ci --build firmware/build --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-package
          path: dist/

  docker-build:
    name: Backend Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t sticky-assistant-backend backend
      - name: Start it and wait for /health
        run: |
          docker run -d --name backend -p 8000:8000 -e WHISPER_MODEL_SIZE=tiny sticky-assistant-backend
          for i in $(seq 1 60); do
            if curl -sf localhost:8000/health; then echo; exit 0; fi
            sleep 5
          done
          docker logs backend
          exit 1

  backend-checks:
    name: Backend sanity checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile app.py calendar_service.py settings.py storage.py
      - name: Import check
        # No ANTHROPIC_API_KEY set on purpose: app.py must not crash at
        # import/startup time without one, only /converse should fail
        # until it's configured (same thing the backend README documents).
        run: python -c "import app"
